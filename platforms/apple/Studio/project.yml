# Liquid Glass Studio: the SwiftUI demo of the LiquidGlass package, for iOS and macOS.
#
# The Xcode project is generated from this file with XcodeGen
# (https://github.com/yonaskolb/XcodeGen); both are committed. Regenerate after
# adding or removing files:
#
#   platforms/apple/scripts/generate-project.sh
name: LiquidGlassStudio
options:
  bundleIdPrefix: com.rookasrudzianskas.liquidglass
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  LiquidGlass:
    path: ../../..
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "2"
targets:
  LiquidGlassStudio:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: LiquidGlass
        product: LiquidGlass
    settings:
      base:
        PRODUCT_NAME: Liquid Glass Studio
        PRODUCT_BUNDLE_IDENTIFIER: com.rookasrudzianskas.liquidglass.studio
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Liquid Glass Studio
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "MIT License. Liquid Glass Engineering."
        # iOS only (the [sdk=iphone*] condition keeps them out of the Mac app):
        # the launch screen, portrait on iPhone and every orientation on iPad,
        # and (merged from Config/iOS-Info.plist, as there is no build setting
        # for it) display-link frame rates up to 120 Hz on ProMotion iPhones,
        # which the glass springs ask for.
        "INFOPLIST_KEY_UILaunchScreen_Generation[sdk=iphone*]": YES
        "INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone[sdk=iphone*]": UIInterfaceOrientationPortrait
        "INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad[sdk=iphone*]": UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        "INFOPLIST_FILE[sdk=iphone*]": Config/iOS-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_PREVIEWS: YES
        DEAD_CODE_STRIPPING: YES
    scheme:
      testTargets:
        - LiquidGlassStudioUITests
  LiquidGlassStudioUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
    dependencies:
      - target: LiquidGlassStudio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.rookasrudzianskas.liquidglass.studio.uitests
        TEST_TARGET_NAME: LiquidGlassStudio
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
