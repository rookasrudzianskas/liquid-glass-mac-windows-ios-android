# Monthly dependency updates. GitHub Actions updates, majors included, arrive as one grouped pull request a month.
# For the website and Windows, minor and patch updates arrive as one grouped pull request and major updates get a
# pull request each; toolchain majors are not proposed at all, and Android takes patch updates only (see each
# ignore list).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: CI
    groups:
      actions:
        update-types: [major, minor, patch]

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: monthly
    commit-message:
      prefix: Website
    groups:
      website:
        update-types: [minor, patch]
    ignore:
      # The Node types follow the Node major that CI and the toolchain use (22); bump them together with it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gradle
    # The Hello Glass example builds the library from source in a composite build, which uses one Android Gradle
    # Plugin and Kotlin version for both builds, so both catalogs and both wrappers move together.
    directories: ["/platforms/android", "/examples/compose/HelloGlass"]
    schedule:
      interval: monthly
    commit-message:
      prefix: Android
    groups:
      android:
        update-types: [patch]
    ignore:
      # The library exposes Compose and Kotlin to every app that uses it, and minor releases of Kotlin, the Android
      # Gradle Plugin and AndroidX raise those apps' floors (Kotlin metadata, compileSdk, AGP). On the 1.0.x line
      # only patch updates are proposed; minor and major toolchain upgrades (including every Compose BOM, whose
      # calendar versions read as majors) are adopted deliberately in a minor release, after the migration and a
      # full test run on every API level.
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: nuget
    directory: /platforms/windows
    schedule:
      interval: monthly
    commit-message:
      prefix: Windows
    groups:
      windows:
        update-types: [minor, patch]
    ignore:
      # Toolchain majors (.NET packages and the xUnit test stack) are adopted deliberately in a minor release, after
      # the migration and a full test run on Windows, not from a Dependabot pull request.
      - dependency-name: "Microsoft.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "xunit*"
        update-types: ["version-update:semver-major"]
