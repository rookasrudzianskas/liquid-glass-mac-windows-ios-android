name: Private contact request
description: Ask the maintainer for a private way to send a security or code of conduct report. Issues are public, so this one carries no details.
title: "Private contact request"
body:
  - type: markdown
    attributes:
      value: |
        Issues are public. Use this form only to ask for a private channel: never describe the problem, the people involved or the affected systems here. The maintainer will reply with a way to send the report privately.

        For a vulnerability, use [Report a vulnerability](https://github.com/rookasrudzianskas/liquid-glass-mac-windows-ios-android/security/advisories/new) on the Security tab, which sends a private advisory directly; this form is the fallback when you cannot use it (see the [security policy](https://github.com/rookasrudzianskas/liquid-glass-mac-windows-ios-android/blob/main/SECURITY.md)).
  - type: checkboxes
    id: no-details
    attributes:
      label: Before you submit
      options:
        - label: This issue contains no details of the problem, the people involved or the affected systems.
          required: true
