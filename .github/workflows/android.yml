name: Android

on:
  push:
    branches: [main]
    paths:
      - "platforms/android/**"
      - "spec/**"
      - ".github/workflows/android.yml"
      - "jitpack.yml"
  pull_request:
    paths:
      - "platforms/android/**"
      - "spec/**"
      - ".github/workflows/android.yml"
      - "jitpack.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: platforms/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests against spec/vectors.json
        run: ./gradlew :liquidglass:testDebugUnitTest
      - name: Lint
        run: ./gradlew lint
      - name: Library AAR and Maven repository
        run: ./gradlew :liquidglass:publishReleasePublicationToArtifactsRepository :liquidglass:exportAar
      - name: Liquid Glass Studio APK
        run: ./gradlew :studio:assembleRelease
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            artifacts/android/
            platforms/android/studio/build/outputs/apk/release/*.apk
            platforms/android/liquidglass/build/reports/
          if-no-files-found: warn

  gpu:
    name: GPU rendering tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          working-directory: platforms/android
          script: ./gradlew :liquidglass:connectedDebugAndroidTest
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-gpu-tests
          path: platforms/android/liquidglass/build/reports/androidTests/
          if-no-files-found: warn
