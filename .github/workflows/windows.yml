name: Windows

# Builds and verifies the WPF port on a real Windows machine. Pushes to main and manual runs then report back through
# git: the `report` job force-pushes one fresh commit with logs, test results, fxc shader bytecode, screenshots and the
# list of release files with their checksums to the orphan branch `ci-windows`. No binaries go there: every clone of
# the repository that fetches all branches (Swift Package Manager's cache does) would download them. Pull requests run
# the same checks with a read-only token and keep the report as a workflow artifact. Every run keeps the complete
# release set (packages and all three Studio zips, built as continuous-integration builds) as the `windows-release`
# artifact.
on:
  push:
    branches: [main]
    paths:
      - "platforms/windows/**"
      - "spec/vectors.json"
      - "spec/shaders/**"
      - "assets/wallpapers/**"
      - "LICENSE"
      - "NOTICE.md"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "platforms/windows/**"
      - "spec/vectors.json"
      - "spec/shaders/**"
      - "assets/wallpapers/**"
      - "LICENSE"
      - "NOTICE.md"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  REPORT: ${{ github.workspace }}\report
  RELEASE: ${{ github.workspace }}\release

jobs:
  windows:
    name: Build, test, shaders, screenshots
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: platforms/windows
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          # .NET 10 builds everything; .NET 8 runs the library's net8.0-windows build under test.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Prepare report
        run: |
          New-Item -ItemType Directory -Force -Path $env:REPORT, $env:RELEASE | Out-Null
          "commit: $env:GITHUB_SHA`nrun: $env:GITHUB_RUN_ID`nstarted: $(Get-Date -Format o)" | Set-Content "$env:REPORT\run.txt"
          dotnet --info | Out-File "$env:REPORT\dotnet-info.txt"
          Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion, AdapterRAM, VideoModeDescription | Format-List | Out-File "$env:REPORT\video.txt"
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber | Format-List | Out-File -Append "$env:REPORT\video.txt"

      - name: Raise the display resolution
        continue-on-error: true
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop; "Set-DisplayResolution: ok" }
          catch { "Set-DisplayResolution failed: $_" }
          Add-Type -AssemblyName System.Windows.Forms
          "screen: $([System.Windows.Forms.Screen]::PrimaryScreen.Bounds)" | Tee-Object -Append -FilePath "$env:REPORT\video.txt"

      - name: Compile shaders with fxc
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter fxc.exe |
            Where-Object { $_.FullName -like '*\x64\*' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { throw "fxc.exe not found" }
          $out = "$env:REPORT\shaders"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          "fxc: $($fxc.FullName)" | Set-Content "$out\fxc.log"
          $failed = $false
          foreach ($shader in Get-ChildItem src\LiquidGlass.Wpf\Shaders -Filter *.fx) {
            $name = $shader.BaseName
            & $fxc.FullName /nologo /T ps_3_0 /E main /O3 /I src\LiquidGlass.Wpf\Shaders /Fo "$out\$name.ps" /Fc "$out\$name.asm.txt" $shader.FullName *>&1 |
              Tee-Object -Append -FilePath "$out\fxc.log"
            if ($LASTEXITCODE -ne 0) { $failed = $true; "FAILED: $name" | Add-Content "$out\fxc.log" }
          }
          if ($failed) { throw "fxc failed" }
          # The library embeds this bytecode only while it matches the sources it was compiled from.
          $sources = [IO.File]::ReadAllBytes("$PWD\src\LiquidGlass.Wpf\Shaders\GlassSurface.fx") + [IO.File]::ReadAllBytes("$PWD\src\LiquidGlass.Wpf\Shaders\LiquidGlass.hlsli")
          $hash = -join ([Security.Cryptography.SHA256]::Create().ComputeHash([byte[]]$sources) | ForEach-Object { $_.ToString("x2") })
          Set-Content -NoNewline -Path "$out\GlassSurface.sha256" -Value "$hash`n"
          $committed = (Get-Content src\LiquidGlass.Wpf\Shaders\Compiled\GlassSurface.sha256 -ErrorAction SilentlyContinue | Select-Object -First 1)
          $state = if ($committed -eq $hash) { "current" } else { "STALE (committed $committed, sources $hash)" }
          "precompiled shader: $state" | Tee-Object -Append -FilePath "$out\fxc.log"

      - name: Build
        run: |
          dotnet build LiquidGlass.sln -c Release 2>&1 | Tee-Object -FilePath "$env:REPORT\build.log"
          if ($LASTEXITCODE -ne 0) { throw "build failed" }

      - name: Test
        run: |
          dotnet test LiquidGlass.sln -c Release --no-build --logger "trx" --logger "console;verbosity=normal" --results-directory "$env:REPORT\tests" 2>&1 |
            Tee-Object -FilePath "$env:REPORT\test.log"
          if ($LASTEXITCODE -ne 0) { throw "tests failed" }

      - name: Probe WPF rendering
        if: always()
        run: |
          dotnet run --project tools\LiquidGlass.CiTools -c Release --no-build -- probe --out "$env:REPORT\probe" 2>&1 |
            Tee-Object -FilePath "$env:REPORT\probe.log"

      - name: Measure WPF's blur
        if: always()
        run: |
          # The σ BlurEffect renders on screen and in RenderTargetBitmap at 100%, 200% and 300%: the model the
          # progressive blur and the Regular frost are planned with.
          dotnet run --project tools\LiquidGlass.CiTools -c Release --no-build -- blur --out "$env:REPORT\blur" 2>&1 |
            Tee-Object -FilePath "$env:REPORT\blur.log"

      - name: Render the glass gallery
        if: always()
        run: |
          dotnet run --project tools\LiquidGlass.CiTools -c Release --no-build -- gallery --out "$env:REPORT\gallery" --wallpaper "$PWD\..\..\assets\wallpapers\aurora-2048.jpg" 2>&1 |
            Tee-Object -FilePath "$env:REPORT\gallery.log"

      - name: Capture Liquid Glass Studio
        if: always()
        run: |
          dotnet run --project tools\LiquidGlass.CiTools -c Release --no-build -- studio --exe "$PWD\src\LiquidGlass.Studio\bin\Release\net10.0-windows\LiquidGlassStudio.exe" --out "$env:REPORT\studio" 2>&1 |
            Tee-Object -FilePath "$env:REPORT\studio.log"
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; ProviderName = '.NET Runtime', 'Application Error' } -MaxEvents 4 -ErrorAction SilentlyContinue |
            Format-List TimeCreated, ProviderName, Message | Out-File "$env:REPORT\studio\runtime-events.txt"

      - name: Publish and smoke-test Studio
        if: always()
        run: |
          $log = "$env:REPORT\publish.txt"
          $failures = @()
          $variants = @(
            @{ Name = "framework-dependent"; Rid = "win-x64"; Zip = "LiquidGlassStudio-win-x64.zip"; Run = $true; Args = @("--self-contained", "false") },
            @{ Name = "arm64"; Rid = "win-arm64"; Zip = "LiquidGlassStudio-win-arm64.zip"; Run = $false; Args = @("--self-contained", "false") },
            @{ Name = "self-contained"; Rid = "win-x64"; Zip = "LiquidGlassStudio-win-x64-self-contained.zip"; Run = $true; Args = @("--self-contained", "true", "-p:PublishSingleFile=true", "-p:IncludeNativeLibrariesForSelfExtract=true", "-p:EnableCompressionInSingleFile=true") }
          )
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($v in $variants) {
            $out = "$env:RUNNER_TEMP\studio-$($v.Name)"
            dotnet publish src\LiquidGlass.Studio -c Release -r $v.Rid @($v.Args) -o $out 2>&1 | Out-File -Append "$env:REPORT\publish.log"
            if ($LASTEXITCODE -ne 0) { "$($v.Name): publish FAILED" | Add-Content $log; $failures += "$($v.Name) publish"; continue }
            # What users unzip: the app, its license and notices; no PDBs or IntelliSense files.
            Remove-Item "$out\*.pdb", "$out\*.xml" -ErrorAction SilentlyContinue
            foreach ($file in "LICENSE", "NOTICE.md") {
              if (-not (Test-Path "$out\$file")) { "$($v.Name): $file missing" | Add-Content $log; $failures += "$($v.Name) lacks $file" }
            }
            $zip = "$env:RELEASE\$($v.Zip)"
            if (Test-Path $zip) { Remove-Item $zip }
            [IO.Compression.ZipFile]::CreateFromDirectory($out, $zip, [IO.Compression.CompressionLevel]::Optimal, $false)
            $mb = [math]::Round((Get-Item $zip).Length / 1MB, 1)
            if (-not $v.Run) { "$($v.Name): zip $mb MB, published for $($v.Rid) (not run on this x64 runner)" | Add-Content $log; continue }
            $start = Get-Date
            $p = Start-Process -FilePath "$out\LiquidGlassStudio.exe" -ArgumentList "--page", "controls", "--exit-after", "8" -PassThru
            $finished = $p.WaitForExit(60000)
            $code = if ($finished) { $p.ExitCode } else { $p.Kill(); "timeout" }
            "$($v.Name): zip $mb MB, smoke test exit $code after $([math]::Round(((Get-Date) - $start).TotalSeconds, 1)) s" | Add-Content $log
            if ($code -ne 0) { $failures += "$($v.Name) exit $code" }
          }
          Get-Content $log
          if ($failures) { throw "Studio publish or smoke test failed: $($failures -join ', ')" }

      - name: Pack and check the NuGet packages
        if: always()
        run: |
          $out = "$env:RELEASE\nuget"
          $log = "$env:REPORT\packages.txt"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $failures = @()
          foreach ($project in "src\LiquidGlass.Core\LiquidGlass.Core.csproj", "src\LiquidGlass.Wpf\LiquidGlass.Wpf.csproj") {
            dotnet pack $project -c Release -o $out 2>&1 | Out-File -Append "$env:REPORT\pack.log"
            if ($LASTEXITCODE -ne 0) { $failures += "pack $project" }
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($package in Get-ChildItem $out -Filter *.nupkg) {
            $zip = [IO.Compression.ZipFile]::OpenRead($package.FullName)
            try {
              $names = @($zip.Entries | ForEach-Object { $_.FullName })
              "$($package.Name): $(($names | Where-Object { $_ -notlike '_rels/*' -and $_ -notlike 'package/*' } | Sort-Object) -join ', ')" | Add-Content $log
              foreach ($required in "LICENSE", "NOTICE.md", "README.md", "icon.png") {
                if ($names -notcontains $required) { $failures += "$($package.Name) lacks $required" }
              }
              $nuspec = $zip.Entries | Where-Object { $_.FullName -like "*.nuspec" } | Select-Object -First 1
              $reader = New-Object IO.StreamReader($nuspec.Open())
              $manifest = $reader.ReadToEnd()
              $reader.Close()
              if ($manifest -notmatch "<releaseNotes>") { $failures += "$($package.Name) has no release notes" }
              if ($package.Name -like "LiquidGlassEngineering.Wpf.*") {
                foreach ($tfm in "net48", "net8.0-windows7.0", "net10.0-windows7.0") {
                  if ($names -notcontains "lib/$tfm/LiquidGlass.Wpf.dll") { $failures += "$($package.Name) lacks lib/$tfm" }
                }
              }
              # Continuous-integration builds map source paths to /_/: no library may record the build machine's.
              foreach ($dll in $zip.Entries | Where-Object { $_.FullName -like "*.dll" }) {
                $reader = New-Object IO.StreamReader($dll.Open(), [Text.Encoding]::GetEncoding(28591))
                $text = $reader.ReadToEnd()
                $reader.Close()
                if ($text.Contains($env:GITHUB_WORKSPACE)) { $failures += "$($dll.FullName) in $($package.Name) records the build path" }
                # The symbols travel inside the library (the project feed has no symbol server); the embedded PDB is
                # compressed, so its source paths are read from it: every one mapped to /_/.
                $memory = New-Object IO.MemoryStream
                $entry = $dll.Open()
                $entry.CopyTo($memory)
                $entry.Close()
                $memory.Position = 0
                $pe = New-Object System.Reflection.PortableExecutable.PEReader($memory)
                try {
                  $embedded = @($pe.ReadDebugDirectory() | Where-Object { $_.Type -eq [System.Reflection.PortableExecutable.DebugDirectoryEntryType]::EmbeddedPortablePdb })
                  if ($embedded.Count -eq 0) { $failures += "$($dll.FullName) in $($package.Name) has no embedded PDB" }
                  else {
                    $provider = $pe.ReadEmbeddedPortablePdbDebugDirectoryData($embedded[0])
                    try {
                      $pdb = $provider.GetMetadataReader()
                      $documents = @($pdb.Documents | ForEach-Object { $pdb.GetString($pdb.GetDocument($_).Name) })
                      $unmapped = @($documents | Where-Object { -not $_.StartsWith("/_/") })
                      if ($documents.Count -eq 0) { $failures += "$($dll.FullName) in $($package.Name) has a PDB without sources" }
                      if ($unmapped.Count -gt 0) { $failures += "$($dll.FullName) in $($package.Name) has unmapped source paths ($($unmapped[0]))" }
                      "  $($dll.FullName): embedded PDB, $($documents.Count) sources under /_/" | Add-Content $log
                    }
                    finally { $provider.Dispose() }
                  }
                }
                finally { $pe.Dispose() }
              }
            }
            finally { $zip.Dispose() }
          }
          Get-Content $log
          if ($failures) { throw "package check failed: $($failures -join '; ')" }

      - name: Restore and build a consumer of the packages
        if: always()
        run: |
          # What a developer does with the install instructions: a WPF app for every target the package names, restored
          # from these packages (and nuget.org) into an empty package folder, so nothing comes from a cache.
          $consumer = "$env:RUNNER_TEMP\consumer"
          $log = "$env:REPORT\consumer.txt"
          New-Item -ItemType Directory -Force -Path $consumer | Out-Null
          $version = (Get-ChildItem "$env:RELEASE\nuget" -Filter "LiquidGlassEngineering.Wpf.*.nupkg").BaseName -replace '^LiquidGlassEngineering\.Wpf\.', ''
          if (-not $version) { "no LiquidGlassEngineering.Wpf package to consume" | Set-Content $log; throw "no package" }
          @"
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
              <add key="release" value="$env:RELEASE\nuget" />
            </packageSources>
          </configuration>
          "@ | Set-Content "$consumer\nuget.config"
          @"
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFrameworks>net48;net8.0-windows;net10.0-windows</TargetFrameworks>
              <UseWPF>true</UseWPF>
              <LangVersion>latest</LangVersion>
              <RestorePackagesPath>$env:RUNNER_TEMP\consumer-packages</RestorePackagesPath>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="LiquidGlassEngineering.Wpf" Version="$version" />
            </ItemGroup>
          </Project>
          "@ | Set-Content "$consumer\Consumer.csproj"
          @"
          using System;
          using System.Windows;
          using LiquidGlass.Wpf;
          public static class Program
          {
              [STAThread]
              public static void Main()
              {
                  var scene = new GlassScene();
                  scene.Children.Add(new GlassButton { Content = "Glass" });
                  new Window { Content = scene };
                  Console.WriteLine(GlassDiagnostics.ShaderSource);
              }
          }
          "@ | Set-Content "$consumer\Program.cs"
          dotnet build "$consumer\Consumer.csproj" -c Release 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw "a consumer of LiquidGlassEngineering.Wpf $version did not restore and build for net48, net8.0-windows and net10.0-windows" }
          foreach ($tfm in "net48", "net8.0-windows", "net10.0-windows") {
            $exe = "$consumer\bin\Release\$tfm\Consumer.exe"
            if (-not (Test-Path $exe)) { throw "no $tfm build of the consumer" }
            $source = & $exe
            "$($tfm): runs, shader $source" | Tee-Object -Append -FilePath $log
            if ($LASTEXITCODE -ne 0) { throw "the $tfm consumer did not run" }
          }

      - name: List the release artifacts
        if: always()
        run: |
          # The report lists the release files; the files themselves are the windows-release artifact.
          $list = "$env:REPORT\release.txt"
          foreach ($file in Get-ChildItem $env:RELEASE -Recurse -File | Sort-Object FullName) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$($file.FullName.Substring($env:RELEASE.Length + 1)): $($file.Length) bytes, sha256 $hash" | Add-Content $list
          }
          Get-Content $list -ErrorAction SilentlyContinue

      - name: Summarize
        if: always()
        run: |
          $summary = "$env:REPORT\summary.txt"
          "commit $env:GITHUB_SHA, run $env:GITHUB_RUN_ID, finished $(Get-Date -Format o)" | Set-Content $summary
          "job status: ${{ job.status }}" | Add-Content $summary
          Get-Content "$env:REPORT\shaders\fxc.log" -ErrorAction SilentlyContinue | Select-String "precompiled shader" | ForEach-Object { $_.Line } | Add-Content $summary
          Get-Content "$env:REPORT\publish.txt" -ErrorAction SilentlyContinue | Add-Content $summary
          Get-Content "$env:REPORT\release.txt" -ErrorAction SilentlyContinue | Add-Content $summary
          Get-Content "$env:REPORT\studio\studio.txt" -ErrorAction SilentlyContinue | Add-Content $summary
          Get-Content "$env:REPORT\consumer.txt" -ErrorAction SilentlyContinue | Select-String ": runs, shader " | ForEach-Object { "consumer $($_.Line)" } | Add-Content $summary
          Get-Content "$env:REPORT\blur\blur.txt" -ErrorAction SilentlyContinue | Add-Content $summary
          foreach ($trx in Get-ChildItem "$env:REPORT\tests" -Filter *.trx -ErrorAction SilentlyContinue) {
            [xml]$x = Get-Content $trx.FullName
            $c = $x.TestRun.ResultSummary.Counters
            "$($trx.Name): total $($c.total), passed $($c.passed), failed $($c.failed)" | Add-Content $summary
          }

      - name: Check that the precompiled shader is current
        if: always()
        run: |
          # Bytecode compiled from older sources is ignored by the library, which then compiles the HLSL at run time:
          # commit the fxc output in this report (shaders/GlassSurface.ps and .sha256) before releasing.
          $state = Get-Content "$env:REPORT\shaders\fxc.log" -ErrorAction SilentlyContinue | Select-String "precompiled shader"
          if (-not $state) { throw "fxc did not report on the precompiled shader" }
          if ($state.Line -match "STALE") { throw "$($state.Line): refresh src\LiquidGlass.Wpf\Shaders\Compiled from this report" }
          $state.Line

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-report
          path: ${{ env.REPORT }}
          if-no-files-found: warn

      - name: Upload the release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: ${{ env.RELEASE }}
          if-no-files-found: warn

  report:
    name: Publish the report to ci-windows
    needs: windows
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-report
          path: report
      - name: Push the report
        working-directory: report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b ci-windows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.autocrlf input
          git add -A
          git commit -q -m "Windows CI report for ${GITHUB_SHA::7} (run $GITHUB_RUN_ID)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-windows
