name: Spec

on:
  push:
    branches: [main]
    paths:
      - "spec/**"
      - "plugins/**"
      - ".claude-plugin/**"
      - "LICENSE"
      - "NOTICE.md"
      - "scripts/sync-skill-references.mjs"
      - "scripts/check-plugin.mjs"
      - "scripts/build-downloads.mjs"
      - ".github/workflows/spec.yml"
  pull_request:
    paths:
      - "spec/**"
      - "plugins/**"
      - ".claude-plugin/**"
      - "LICENSE"
      - "NOTICE.md"
      - "scripts/sync-skill-references.mjs"
      - "scripts/check-plugin.mjs"
      - "scripts/build-downloads.mjs"
      - ".github/workflows/spec.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vectors:
    name: Golden vectors are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Regenerate spec/vectors.json
        run: node spec/generate-vectors.mjs
      - name: Fail if the committed vectors are stale
        run: git diff --exit-code -- spec/vectors.json
      - name: Fail if the skills' copies of the spec, LICENSE or NOTICE.md are stale
        run: node scripts/sync-skill-references.mjs --check

  plugin:
    name: Plugin and skills are valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Marketplace, plugin manifest, skill frontmatter, skill names and links
        run: node scripts/check-plugin.mjs
